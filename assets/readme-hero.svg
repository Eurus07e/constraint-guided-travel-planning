<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Constraint-guided travel planning</title>
  <desc id="desc">A dark teal banner with a route connecting Draft, Verify and Repair. Verifier-guided local repair for language-agent planning.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#15343b" stroke-width="1"/>
    </pattern>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#091e26"/>
      <stop offset="1" stop-color="#103239"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#background)"/>
  <rect x="712" y="16" width="472" height="288" rx="12" fill="url(#grid)"/>
  <rect x="48" y="43" width="5" height="18" rx="2" fill="#58e0be"/>
  <text x="67" y="58" fill="#9eb9c0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="3">CONSTRAINT-GUIDED</text>
  <text x="46" y="130" fill="#f2f8f8" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="700" letter-spacing="-1.5">TRAVEL PLANNING</text>
  <text x="49" y="171" fill="#58e0be" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="2">VERIFY. REPAIR. RECHECK.</text>
  <text x="49" y="220" fill="#b1c6cc" font-family="Arial,Helvetica,sans-serif" font-size="17">Verifier-guided local repair for language-agent planning.</text>
  <path d="M49 254H643" stroke="#28454d"/>
  <text x="49" y="283" fill="#8eabb3" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="1.5">CC-MAR  /  TRAVELPLANNER  /  REPRODUCIBLE CODE</text>
  <path d="M775 235H826Q850 235 850 211V163Q850 139 874 139H951Q975 139 975 115V83Q975 59 999 59H1093" fill="none" stroke="#58e0be" stroke-width="4" stroke-linecap="round"/>
  <path d="M975 139H1065Q1093 139 1093 167V205Q1093 233 1065 233H961" fill="none" stroke="#648a95" stroke-width="2" stroke-dasharray="5 7"/>
  <circle cx="775" cy="235" r="10" fill="#102c34" stroke="#58e0be" stroke-width="3"/>
  <circle cx="916" cy="139" r="17" fill="#143e43" stroke="#58e0be" stroke-width="2"/>
  <path d="m909 139 5 5 9-10" fill="none" stroke="#58e0be" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1093" cy="59" r="10" fill="#58e0be"/>
  <text x="756" y="272" fill="#b1c6cc" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">DRAFT</text>
  <text x="886" y="185" fill="#b1c6cc" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">VERIFY</text>
  <text x="1062" y="98" fill="#b1c6cc" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">REPAIR</text>
</svg>
