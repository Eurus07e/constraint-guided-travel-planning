name: unit-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: pip install -r requirements-research.txt
      - name: Run offline unit tests
        run: |
          python -m unittest \
            scripts.test_analyze_verifier_calibration \
            scripts.test_api_endpoint_helpers \
            scripts.test_evaluate_submission_subset \
            scripts.test_repair_operator_ablations \
            scripts.test_strong_baseline_runner
