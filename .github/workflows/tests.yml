name: unit-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-research.txt
      - name: Install research dependencies
        run: pip install -r requirements-research.txt
      - name: Run offline unit tests
        env:
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
